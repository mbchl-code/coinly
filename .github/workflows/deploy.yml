name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Ветка или коммит для выкатки
        default: main

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        env:
          REF: ${{ inputs.ref || github.ref_name }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '~/coinly' }}
          COINLY_PORT: ${{ secrets.COINLY_PORT || '9443' }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: REF,DEPLOY_PATH,COINLY_PORT
          script: |
            set -e
            cd "$(eval echo "$DEPLOY_PATH")"
            git fetch origin "$REF"
            git checkout --force --detach FETCH_HEAD
            COINLY_PORT="$COINLY_PORT" docker compose up -d --build
            docker image prune -f
